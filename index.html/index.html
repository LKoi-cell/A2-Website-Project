<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Rose Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to the Red Rose Website</h1>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>About Red Roses</h2>
      <p>The red rose is a symbol of love, passion, and beauty. This simple HTML5 site demonstrates basic web design principles.</p>
    </section>

    <section id="gallery">
      <h2>Gallery</h2>
      <img src="images/rose.jpg" alt="Red Rose Flower">
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form>
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <label for="message">Message:</label>
        <textarea id="message" required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Red Rose Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
